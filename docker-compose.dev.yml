services:
  # Optional local Postgres — only starts when you explicitly use --profile local-db.
  # By default the app reads DATABASE_URL from .env.local (your cloud DB).
  db:
    profiles: [local-db]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopify_analyser
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: deps
    command: ["sh", "-c", "npx prisma db push --accept-data-loss && npm run dev"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false

volumes:
  postgres_data_dev:
