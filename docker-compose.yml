services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopify_analyser
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      # These two override .env.local so the app talks to the db container, not an external DB
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopify_analyser
      DIRECT_URL: postgresql://postgres:postgres@db:5432/shopify_analyser
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
