services:
  # ── Application ─────────────────────────────────────────────────────────────
  # Builds the production image from the local Dockerfile (multi-stage,
  # standalone Next.js output). DATABASE_URL and all other secrets are injected
  # from .env.local at runtime — the file is never baked into the image.
  # By default the app connects to the cloud DB (Supabase) declared in .env.local.
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    dns:
      - 8.8.8.8
      - 1.1.1.1
